services:
  - type: web
    name: student-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false   # paste ONLY the Atlas connection string in the Render dashboard
      - key: FRONTEND_URL
        sync: false   # e.g. https://your-app.vercel.app (comma-separate more; https://*.vercel.app allowed)
      - key: NODE_VERSION
        value: 20
